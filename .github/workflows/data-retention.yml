# Once a day: clear customer contact details and message text on old closed
# orders, for organisations that have switched retention on (readiness plan
# Task 6). Does nothing until COAST_APP_URL and CRON_SECRET are set.
name: Data retention

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Apply retention
        env:
          COAST_APP_URL: ${{ secrets.COAST_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$COAST_APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "COAST_APP_URL or CRON_SECRET isn't set yet — nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${COAST_APP_URL%/}/api/cron/data-retention"
