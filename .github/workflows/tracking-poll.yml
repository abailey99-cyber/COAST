# Runs COAST's carrier tracking check every 30 minutes (decisions B12).
# Vercel's free plan only allows daily scheduled jobs, so GitHub runs the
# schedule instead. It does nothing until two repository secrets are set
# (Settings → Secrets and variables → Actions):
#   COAST_APP_URL  the live site, e.g. https://coast.example.com
#   CRON_SECRET    the same value as the CRON_SECRET environment variable on the host
name: Tracking poll

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check shipments with the carriers
        env:
          COAST_APP_URL: ${{ secrets.COAST_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$COAST_APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "COAST_APP_URL or CRON_SECRET isn't set yet — nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${COAST_APP_URL%/}/api/cron/tracking-poll"
